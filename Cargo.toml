[workspace]
resolver = "2"
members = ["crates/collider-core", "crates/collider-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"
repository = "https://github.com/dnlsplnd/collider"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
